<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务维护中 · PhaEpM</title>
    <link rel="icon" type="image/x-icon" href="https://phaepm.com/static/favicon.ico">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --sky-50: #F0F9FF; --sky-100: #E0F2FE; --sky-200: #BAE6FD;
            --sky-300: #7DD3FC; --sky-400: #38BDF8; --sky-500: #0EA5E9;
            --sky-600: #0284C7; --sky-700: #0369A1; --sky-800: #075985;
            --sky-900: #0C4A6E;
            --slate-50: #f8fafc; --slate-100: #f1f5f9; --slate-200: #e2e8f0;
            --slate-300: #cbd5e1; --slate-400: #94a3b8; --slate-500: #64748b;
            --slate-600: #475569; --slate-700: #334155; --slate-800: #1e293b;
            --slate-900: #0f172a; --slate-950: #020617;
            --amber-400: #FBBF24; --amber-500: #F59E0B;
            --pink-400: #FB7185;
            --orange-400: #FB923C;
            --bg: var(--sky-50);
            --card-bg: rgba(255,255,255,0.72);
            --card-border: rgba(14,165,233,0.12);
            --card-shadow: 0 4px 20px rgba(14,165,233,0.06), inset 0 1px 0 rgba(255,255,255,0.7);
            --text: var(--slate-900); --text-secondary: var(--slate-600);
            --text-muted: var(--slate-400);
        }

        html.dark {
            --bg: var(--slate-950);
            --card-bg: rgba(15,23,42,0.82);
            --card-border: rgba(56,189,248,0.14);
            --card-shadow: 0 4px 24px rgba(0,0,0,0.35), inset 0 1px 0 rgba(56,189,248,0.08);
            --text: var(--slate-100); --text-secondary: var(--slate-300);
            --text-muted: var(--slate-500);
        }

        html, body {
            min-height: 100vh;
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Background glow orbs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            top: -30%; right: -15%;
            width: 55vw; height: 55vw;
            background: radial-gradient(circle, rgba(79,128,240,0.08) 0%, rgba(99,149,255,0.05) 40%, transparent 65%);
        }
        body::after {
            bottom: -25%; left: -10%;
            width: 45vw; height: 45vw;
            background: radial-gradient(circle, rgba(245,166,115,0.06) 0%, rgba(240,140,170,0.04) 50%, transparent 65%);
        }
        html.dark body::before {
            background: radial-gradient(circle, rgba(99,149,255,0.10) 0%, rgba(79,128,240,0.06) 40%, transparent 65%);
        }
        html.dark body::after {
            background: radial-gradient(circle, rgba(255,160,100,0.06) 0%, rgba(255,145,175,0.04) 50%, transparent 65%);
        }

        .container {
            width: 100%;
            max-width: 540px;
            position: relative;
            z-index: 1;
        }

        /* Glass card */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: 1rem;
            position: relative;
            overflow: hidden;
            box-shadow: var(--card-shadow);
        }

        /* Gradient scroll animation */
        @keyframes gradient-scroll {
            0%   { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        /* Floating animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50%      { transform: translateY(-8px); }
        }

        /* Pulse glow */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50%      { opacity: 0.8; transform: scale(1.05); }
        }

        /* Header */
        .card-header {
            padding: 1.75rem 1.75rem 1.25rem;
            text-align: center;
            border-bottom: 1px solid rgba(14,165,233,0.08);
        }
        html.dark .card-header {
            border-bottom-color: rgba(56,189,248,0.1);
        }

        .error-icon {
            width: 72px; height: 72px;
            margin: 0 auto 1rem;
            animation: float 3s ease-in-out infinite;
        }
        .error-icon svg {
            width: 100%; height: 100%;
            filter: drop-shadow(0 4px 12px rgba(14,165,233,0.2));
        }
        html.dark .error-icon svg {
            filter: drop-shadow(0 4px 12px rgba(56,189,248,0.15));
        }

        .error-code {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #0284C7, #0EA5E9, #F59E0B, #FB7185, #0284C7);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradient-scroll 4s linear infinite;
            line-height: 1.2;
        }

        .error-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--text);
            margin-top: 0.25rem;
        }

        .error-subtitle {
            font-size: 0.8125rem;
            color: var(--text-muted);
            margin-top: 0.375rem;
        }

        /* Body */
        .card-body {
            padding: 1.25rem 1.75rem 1.5rem;
        }

        /* Notice block */
        .notice-block {
            padding: 1rem;
            border-radius: 0.75rem;
            background: rgba(245,158,11,0.06);
            border: 1px solid rgba(245,158,11,0.15);
            margin-bottom: 1rem;
        }
        html.dark .notice-block {
            background: rgba(245,158,11,0.06);
            border-color: rgba(245,158,11,0.12);
        }

        .notice-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
        }
        .notice-header strong {
            font-size: 0.875rem;
            color: #b45309;
        }
        html.dark .notice-header strong {
            color: #fbbf24;
        }
        .notice-block p {
            font-size: 0.8125rem;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        /* Contact section */
        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 0.75rem;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.625rem;
        }
        @media (max-width: 420px) {
            .contact-grid { grid-template-columns: 1fr; }
        }

        .contact-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.875rem 1rem;
            border-radius: 0.75rem;
            background: rgba(14,165,233,0.04);
            border: 1px solid rgba(14,165,233,0.08);
            text-decoration: none;
            color: var(--text);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        html.dark .contact-card {
            background: rgba(56,189,248,0.04);
            border-color: rgba(56,189,248,0.08);
        }
        .contact-card:hover {
            border-color: rgba(14,165,233,0.25);
            box-shadow: 0 4px 16px rgba(14,165,233,0.08);
            transform: translateY(-1px);
        }
        html.dark .contact-card:hover {
            border-color: rgba(56,189,248,0.2);
            box-shadow: 0 4px 16px rgba(56,189,248,0.06);
        }

        .contact-icon {
            width: 36px; height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1rem;
        }

        .contact-icon.email  { background: rgba(14,165,233,0.1); }
        .contact-icon.qq     { background: rgba(34,197,94,0.1);  }
        .contact-icon.tg     { background: rgba(59,130,246,0.1); }
        .contact-icon.afdian { background: rgba(168,85,247,0.1); }

        html.dark .contact-icon.email  { background: rgba(56,189,248,0.12); }
        html.dark .contact-icon.qq     { background: rgba(74,222,128,0.12); }
        html.dark .contact-icon.tg     { background: rgba(96,165,250,0.12); }
        html.dark .contact-icon.afdian { background: rgba(192,132,252,0.12); }

        .contact-info {
            min-width: 0;
        }
        .contact-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text);
            display: block;
            line-height: 1.3;
        }
        .contact-detail {
            font-size: 0.6875rem;
            color: var(--text-muted);
            display: block;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Footer */
        .card-footer {
            padding: 1rem 1.75rem;
            border-top: 1px solid rgba(14,165,233,0.08);
            text-align: center;
        }
        html.dark .card-footer {
            border-top-color: rgba(56,189,248,0.1);
        }
        .card-footer p {
            font-size: 0.6875rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* Theme toggle */
        .theme-toggle {
            position: fixed;
            top: 1rem; right: 1rem;
            width: 36px; height: 36px;
            border-radius: 0.5rem;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.2s;
            color: var(--text-muted);
        }
        .theme-toggle:hover {
            border-color: var(--sky-400);
            color: var(--sky-500);
        }
        .theme-toggle svg { width: 18px; height: 18px; }
        .theme-toggle .sun  { display: none; }
        .theme-toggle .moon { display: block; }
        html.dark .theme-toggle .sun  { display: block; }
        html.dark .theme-toggle .moon { display: none; }

        /* Status dot */
        .status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #f59e0b;
            display: inline-block;
            margin-right: 0.375rem;
            animation: pulse-glow 2s ease-in-out infinite;
            box-shadow: 0 0 6px rgba(245,158,11,0.4);
        }

        /* Flowing top bar */
        .top-bar {
            height: 2px;
            background: linear-gradient(90deg, #38BDF8, #0EA5E9, #FBBF24, #FB7185, #38BDF8);
            background-size: 200% 100%;
            animation: gradient-scroll 2.5s linear infinite;
            border-radius: 1rem 1rem 0 0;
        }

        /* Lang toggle */
        .lang-toggle {
            position: fixed;
            top: 1rem; right: 3.5rem;
            height: 36px;
            padding: 0 0.75rem;
            border-radius: 0.5rem;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: all 0.2s;
            color: var(--text-muted);
            font-size: 0.75rem;
            font-weight: 600;
            gap: 0.25rem;
        }
        .lang-toggle:hover {
            border-color: var(--sky-400);
            color: var(--sky-500);
        }
    </style>
</head>

        var LANGS = ['zh', 'en', 'ja', 'ko'];
        var currentLangIndex = 0;

        function detectLang() {
            var saved = localStorage.getItem('phaepm_lang');
            if (saved && I18N[saved]) return saved;
            var nav = (navigator.language || '').toLowerCase();
            if (nav.startsWith('zh')) return 'zh';
            if (nav.startsWith('ja')) return 'ja';
            if (nav.startsWith('ko')) return 'ko';
            return 'en';
        }

        function applyLang(lang) {
            var t = I18N[lang];
            if (!t) return;
            document.querySelectorAll('[data-i18n]').forEach(function(el) {
                var key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) el.textContent = t[key];
            });
            document.documentElement.lang = lang;
            document.getElementById('lang-label').textContent = lang.toUpperCase();
            currentLangIndex = LANGS.indexOf(lang);
            localStorage.setItem('phaepm_lang', lang);
        }

        function toggleLang() {
            currentLangIndex = (currentLangIndex + 1) % LANGS.length;
            applyLang(LANGS[currentLangIndex]);
        }

        // ============ Dark mode ============
        function getTheme() {
            var saved = localStorage.getItem('theme');
            if (saved) return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.classList.toggle('dark', theme === 'dark');
            localStorage.setItem('theme', theme);
        }

        function toggleTheme() {
            var next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
            applyTheme(next);
        }

        // ============ Init ============
        applyTheme(getTheme());
        var initLang = detectLang();
        applyLang(initLang);
    </script>
